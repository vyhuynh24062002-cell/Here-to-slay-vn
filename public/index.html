<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Here to Slay Online - Việt Hóa</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background: #161221; color: #f3f0fa; }
    .hidden { display: none !important; }
    .screen { min-height: 100vh; display: flex; flex-direction: column; }
    #lobby-screen { justify-content: center; align-items: center; background: #1a1429; padding: 15px; }
    .lobby-box { background: #241d35; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid #4c3d6e; width: 100%; max-width: 350px; }
    .lobby-box input { padding: 12px; width: 100%; border-radius: 8px; border: none; margin: 8px 0; font-size: 15px; }
    .join-group { display: flex; gap: 6px; margin-top: 10px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #8b5cf6; color: #fff; width: 100%; font-size: 16px; }
    .btn-secondary { background: #10b981; color: #fff; white-space: nowrap; }
    .btn-tool { background: #372c50; color: #fff; margin: 2px; font-size: 12px; }
    .btn-tool.danger { background: #dc2626; }
    .btn-dice { background: #f59e0b; color: #111; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #110d1b; padding: 8px; border-bottom: 2px solid #372c52; flex-wrap: wrap; gap: 6px; }
    .opponents-grid { display: flex; justify-content: center; gap: 8px; padding: 8px; background: #1e182e; flex-wrap: wrap; }
    .opponent-card { background: #2b2340; padding: 8px; border-radius: 8px; border: 1px solid #493b6b; font-size: 12px; }
    .mini-tag { background: #433663; padding: 3px 6px; border-radius: 4px; display: inline-block; margin: 2px; }
    .center-board { display: flex; justify-content: space-around; align-items: center; padding: 10px; background: #241d36; flex-wrap: wrap; gap: 10px; }
    .card-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .deck-pile { width: 95px; height: 135px; border-radius: 10px; background: #362b52; border: 2px dashed #7c65b3; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 5px; }
    .ht-card { width: 140px; height: 196px; border-radius: 10px; position: relative; overflow: hidden; background: #fff; flex-shrink: 0; }
    .ht-card-art { width: 100%; height: 100%; background-repeat: no-repeat; }
    .ht-card-vi-overlay { position: absolute; bottom: 5px; left: 5px; right: 5px; height: 52px; background: #f5f2eb; color: #111; font-size: 9px; line-height: 1.15; padding: 3px; border-radius: 4px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; }
    .ht-card.monster .ht-card-vi-overlay { background: #eae8e3; height: 40px; }
    .ht-card.cursed .ht-card-vi-overlay, .ht-card.item .ht-card-vi-overlay { background: #363042; color: #fff; }
    .equipped-badge { position: absolute; top: 22px; right: 4px; background: #f59e0b; color: #000; font-size: 9px; font-weight: bold; padding: 2px 4px; border-radius: 4px; }
    .my-area { padding: 10px; background: #181324; flex: 1; }
    .my-stats { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; flex-wrap: wrap; gap: 6px; }
    .win-badge { background: #10b981; color: #06281e; font-weight: bold; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .my-board-row { display: flex; gap: 10px; min-height: 210px; background: #211b33; padding: 8px; border-radius: 10px; overflow-x: auto; }
    .hand-row { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
    .log-panel { background: #0e0b16; padding: 8px; font-size: 11px; max-height: 90px; overflow-y: auto; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 10px; }
    .modal-content { background: #261f36; padding: 15px; border-radius: 12px; max-width: 95vw; max-height: 85vh; overflow-y: auto; text-align: center; }
    #zoom-card-container .ht-card { transform: scale(1.6); }
  </style>
</head>
<body>
  <div id="lobby-screen" class="screen">
    <div class="lobby-box">
      <h2>HERE TO SLAY ONLINE</h2>
      <input type="text" id="player-name" placeholder="Nhập tên của bạn..." maxlength="15">
      <button id="btn-create" class="btn-primary">Tạo Phòng Chơi Mới</button>
      <div class="join-group">
        <input type="text" id="room-code-input" placeholder="Mã phòng...">
        <button id="btn-join" class="btn-secondary">Vào Phòng</button>
      </div>
    </div>
  </div>

  <div id="game-screen" class="screen hidden">
    <header class="top-bar">
      <div>Phòng: <strong id="display-room-code">-----</strong></div>
      <div>
        <button id="btn-shuffle" class="btn-tool">🔀 Xào</button>
        <button id="btn-deal" class="btn-tool">🃏 Chia</button>
        <button id="btn-recall" class="btn-tool danger">♻️ Thu</button>
        <button id="btn-leader-modal" class="btn-tool">👑 Thủ Lĩnh</button>
      </div>
      <div>
        <select id="roll-action-type">
          <option value="hero">Anh Hùng</option>
          <option value="attack">Quái Vật</option>
          <option value="challenge">Thách Đấu</option>
        </select>
        <button id="btn-roll" class="btn-dice">🎲 Tung</button>
        <strong id="dice-result">1+1=2</strong>
      </div>
    </header>

    <section id="opponents-area" class="opponents-grid"></section>

    <section class="center-board">
      <div>
        <small>QUÁI VẬT TRÊN BÀN</small>
        <div id="active-monsters" class="card-row"></div>
      </div>
      <div style="display:flex;gap:8px">
        <div id="main-deck-pile" class="deck-pile">
          <span>BỘ BÀI</span><strong id="deck-count">0</strong><small>(Rút 1)</small>
        </div>
        <div class="deck-pile">
          <span>BÀI BỎ</span><strong id="discard-count">0</strong>
        </div>
      </div>
    </section>

    <section class="my-area">
      <div class="my-stats">
        <div>AP: <strong id="my-ap">3</strong>/3 <button onclick="changeAP(-1)">-1</button> <button onclick="changeAP(1)">+1</button> <button onclick="resetAP()">Hồi 3</button></div>
        <div id="win-status" class="win-badge">Tộc: 0/6 | Quái: 0/3</div>
      </div>
      <div class="my-board-row">
        <div><small>THỦ LĨNH & QUÁI</small><div id="my-leader" class="card-row"></div></div>
        <div style="flex:1"><small>TỔ ĐỘI ANH HÙNG</small><div id="my-party" class="card-row"></div></div>
      </div>
      <div>
        <small>BÀI TRÊN TAY (Chạm lá bài để đánh/xem)</small>
        <div id="my-hand" class="hand-row"></div>
      </div>
    </section>
    <aside id="game-logs" class="log-panel"></aside>
  </div>

  <div id="leader-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Chọn Thủ Lĩnh</h3>
      <div id="leader-choices" class="card-row"></div>
      <button class="btn-secondary" style="margin-top:12px" onclick="closeLeaderModal()">Đóng</button>
    </div>
  </div>

  <div id="zoom-modal" class="modal hidden" onclick="this.classList.add('hidden')">
    <div id="zoom-card-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="cards_data.js"></script>
  <script>
    const socket = io();
    let currentRoom = null;

    document.getElementById('btn-create').onclick = () => {
      const name = document.getElementById('player-name').value.trim() || 'Chủ Phòng';
      socket.emit('createRoom', { playerName: name, initialDeck: MAIN_DECK_DATA, monsterDeck: MONSTERS_DATA });
    };

    document.getElementById('btn-join').onclick = () => {
      const name = document.getElementById('player-name').value.trim() || 'Khách';
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) return alert('Nhập mã phòng!');
      socket.emit('joinRoom', { roomCode: code, playerName: name });
    };

    document.getElementById('btn-shuffle').onclick = () => socket.emit('shuffleDeck', currentRoom.code);
    document.getElementById('btn-deal').onclick = () => socket.emit('dealCards', currentRoom.code);
    document.getElementById('btn-recall').onclick = () => {
      if (confirm('Thu toàn bộ bài về bộ bài gốc?')) {
        socket.emit('recallCards', { roomCode: currentRoom.code, fullDeck: MAIN_DECK_DATA, fullMonsters: MONSTERS_DATA });
      }
    };
    document.getElementById('btn-roll').onclick = () => {
      socket.emit('rollDice', { roomCode: currentRoom.code, actionType: document.getElementById('roll-action-type').value });
    };
    document.getElementById('main-deck-pile').onclick = () => socket.emit('drawCard', currentRoom.code);

    document.getElementById('btn-leader-modal').onclick = () => {
      const box = document.getElementById('leader-choices');
      box.innerHTML = '';
      LEADERS_DATA.forEach(leader => {
        const el = createCardElement(leader);
        el.onclick = () => { socket.emit('selectLeader', { roomCode: currentRoom.code, leaderCard: leader }); closeLeaderModal(); };
        box.appendChild(el);
      });
      document.getElementById('leader-modal').classList.remove('hidden');
    };

    function closeLeaderModal() { document.getElementById('leader-modal').classList.add('hidden'); }
    function changeAP(delta) { socket.emit('changeAP', { roomCode: currentRoom.code, delta }); }
    function resetAP() {
      const me = currentRoom.players.find(p => p.id === socket.id);
      if (me) socket.emit('changeAP', { roomCode: currentRoom.code, delta: 3 - me.ap });
    }
    function zoomCard(card) {
      const c = document.getElementById('zoom-card-container');
      c.innerHTML = '';
      c.appendChild(createCardElement(card));
      document.getElementById('zoom-modal').classList.remove('hidden');
    }
